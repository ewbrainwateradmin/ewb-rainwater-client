<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hans Rosling Center for Population Health</title>
    <link rel="stylesheet" href="css/landing_page_new.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kode+Mono:wght@400..700&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">

</head>
<body>
    <header>
        <a href="https://www.washington.edu/populationhealth/hans-rosling-center/" target="_blank" rel="noopener noreferrer">
            <div class="header">
            <img class="logo" src="images/W-Logo_White.png" alt="UW Logo">
            <h1>HANS ROSLING CENTER <span class="h1-break"><span class="h1-for">for</span> POPULATION HEALTH</span></h1>
        </div>
        </a>
    </header>

    <main>
        <div class="visuals">
            <div id="clouds">
                <img class="cloud" src="images/thumbnail_cloud.png" alt="Cloud Thumbnail">
                <img class="cloud" src="images/thumbnail_cloud.png" alt="Cloud Thumbnail">
                <img class="cloud" src="images/thumbnail_cloud.png" alt="Cloud Thumbnail">
            </div>
            <img class="tree_animation" src="images/tree_animation2.gif" alt="landing page design">
            <div class="sun" aria-hidden="true">
                <div class="sun-rays">
                    <div class="ray r1"></div>
                    <div class="ray r2"></div>
                    <div class="ray r3"></div>
                    <div class="ray r4"></div>
                    <div class="ray r5"></div>
                    <div class="ray r6"></div>
                    <div class="ray r7"></div>
                    <div class="ray r8"></div>
                    <div class="ray r9"></div>
                    <div class="ray r10"></div>
                    <div class="ray r11"></div>
                    <div class="ray r12"></div>
                    <div class="ray r13"></div>
                    <div class="ray r14"></div>
                    <div class="ray r15"></div>
                    <div class="ray r16"></div>
                    <div class="ray r17"></div>
                    <div class="ray r18"></div>

                </div>
            </div>
            <div class="bubble-wrap">
                <div class="water-droplet-words">
                    <h4>did you know?</h4>
                </div>
                
                <img class="speech_bubble" src="images/speech bubble.png" alt="Speech Bubble">
            </div>
            <img class="arrow" src="images/arrow2.png" alt="Arrow">
        </div>
        <div class="additional-content">
            <h2 class="stacked-words"><span>this</span> <span>building</span> <span>saves</span></h2>
            <h3>WATER</h3>
            <h2>more info coming soon</h2>
        </div>
        

    </main>
    <div class="brand-row">
                <img class="logo" src="images/W-Logo_White.png" alt="UW Logo">
                <h1 class="brand-title">x</h1>
                <img class="ewb-logo" src="images/thumbnail_Square Logo - UWClear.png" alt="EWB Logo">
    </div>

</body>
</html>
